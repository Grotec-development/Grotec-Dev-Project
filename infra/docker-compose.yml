# GROTEC FarmerOS CRM — development database (PostgreSQL 16)
# Standard dev path: `docker compose -f infra/docker-compose.yml up -d`
# No-Docker fallback: `npm run db:start` (embedded Postgres, same URLs below).
services:
  db:
    image: postgres:16-alpine
    container_name: grotec-crm-db
    environment:
      POSTGRES_USER: grotec
      POSTGRES_PASSWORD: grotec
      POSTGRES_DB: grotec
    ports:
      - "5432:5432"
    volumes:
      - grotec_pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grotec -d grotec"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  grotec_pgdata:
