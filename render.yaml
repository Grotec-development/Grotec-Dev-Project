services:
  # -------------------------------------------------------------
  # GROTEC FarmerOS Backend Web Service (NestJS API)
  # -------------------------------------------------------------
  - type: web
    name: grotec-backend
    env: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build:backend && npm run prisma:migrate-deploy --workspace @grotec/backend
    startCommand: npm run start:backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: grotec-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://*.vercel.app
      - key: DIALER_PROVIDER
        value: exotel
      - key: EXOTEL_ACCOUNT_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_SUBDOMAIN
        value: api.exotel.com
      - key: EXOTEL_CALLER_ID
        value: "08000000000"
      - key: EXOTEL_SMS_SENDER_ID
        value: "08000000000"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "GROTEC FarmerOS <notifications@grotec.local>"
      - key: FOUNDER_EMAIL
        value: founder@grotec.local
      - key: FOUNDER_PASSWORD
        value: Founder@123
      - key: FOUNDER_NAME
        value: Grotec Founder
      - key: SEED_EMPLOYEES
        value: "Manager One,manager@grotec.local,MANAGER;Agent One,agent@grotec.local,AGENT;Staff One,staff@grotec.local,STAFF;Delivery One,delivery@grotec.local,DELIVERY"

databases:
  # -------------------------------------------------------------
  # Managed PostgreSQL Database
  # -------------------------------------------------------------
  - name: grotec-db
    databaseName: grotec
    user: grotec
    plan: starter
    region: singapore
