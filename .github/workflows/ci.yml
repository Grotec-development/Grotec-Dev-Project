# ==============================================================
# GROTEC FarmerOS — Continuous Integration (CI) Pipeline
# ==============================================================
# Automated validation for monorepo:
#  1. Monorepo dependency installation (npm ci)
#  2. Shared package compilation (@grotec/shared)
#  3. Static typechecks (Backend & Frontend)
#  4. Database-independent unit tests (Shared, Backend, Frontend)
#  5. Production SPA bundle build
#
# NOTE: Database-dependent integration/e2e tests are isolated into
# a separate future stage requiring a disposable TEST_DATABASE_URL.
# ==============================================================

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test (DB-Independent)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Backend typecheck
        run: npm run typecheck --workspace @grotec/backend

      - name: Frontend typecheck
        run: npm run typecheck --workspace @grotec/frontend

      - name: Shared package unit tests
        run: npm run test --workspace @grotec/shared

      - name: Backend unit tests (Zero DB dependencies)
        run: npx vitest run --config vitest.unit.config.js
        working-directory: backend

      - name: Frontend unit tests
        run: npm run test --workspace @grotec/frontend

      - name: Frontend production build
        run: npm run build --workspace @grotec/frontend
